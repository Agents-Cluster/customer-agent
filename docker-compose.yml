# 本地开发依赖服务：Milvus + MongoDB + MinIO + Neo4j
# 用法：docker compose up -d
services:
  milvus:
    image: milvusdb/milvus:v2.6.10
    container_name: milvus-local
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: "local"
      DEPLOY_MODE: "STANDALONE"
    ports:
      - "19530:19530"   # gRPC
      - "9091:9091"     # metrics/health
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1',19530),3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mongo:
    image: mongo:7
    container_name: mongo-local
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: minio-local
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  neo4j:
    image: neo4j:5
    container_name: neo4j-local
    environment:
      NEO4J_AUTH: neo4j/123123123
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"     # Browser
      - "7687:7687"     # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  milvus_data:
  mongo_data:
  minio_data:
  neo4j_data:
